name: CI

# v0.2 -- zamyka lukę "Testy i CI -- zero (nimble test, budowanie obu
# wariantów na PR)". Uruchamia testy jednostkowe (tests/test_core.nim) oraz
# buduje OBA warianty (`standard` -- orkiestrator hosta, `atomic` --
# strażnik kontenerów/obrazów) na każdy push i pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"

      - name: Zainstaluj zależności systemowe (sqlite, bwrap, gpg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev bubblewrap gnupg

      - name: nimble install (zależności)
        run: nimble install -d -y

      - name: Testy jednostkowe (nimble test)
        run: nimble test

  build-standard:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: nimble install -d -y
      - name: Buduje wariant STANDARDOWY
        run: nimble standard
      - name: Sanity-check (--version, --help)
        run: |
          ./bin/zpm --version
          ./bin/zpm --help
      - uses: actions/upload-artifact@v4
        with:
          name: zpm-standard-linux-x86_64
          path: bin/zpm

  build-atomic:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.0"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: nimble install -d -y
      - name: Buduje wariant ATOMOWY
        run: nimble atomic
      - name: Sanity-check (--version, --help)
        run: |
          ./bin/zpm-atomic --version
          ./bin/zpm-atomic --help
      - uses: actions/upload-artifact@v4
        with:
          name: zpm-atomic-linux-x86_64
          path: bin/zpm-atomic
