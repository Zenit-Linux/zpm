# Automatycznie wczytywane przez Nim dla KAŻDEGO `nim c src/zpm.nim`
# (w tym plain `nimble build`/`nimble install`, nie tylko `nimble standard`/
# `nimble atomic`) -- orchestrator.nim/atomic.nim używają `std/threadpool`
# (wyszukiwanie równoległe backendów), co wymaga --threads:on; sieć (HTTP/
# TLS) wymaga -d:ssl. Bez tego pliku plain `nimble build` kończył się
# błędem "Threadpool requires --threads:on option." -- ten sam błąd, który
# doprowadził do zgłoszonego przez usera problemu z fastRows (build
# w ogóle nie docierał do etapu linkowania bez tych flag).
--threads:on
-d:ssl
